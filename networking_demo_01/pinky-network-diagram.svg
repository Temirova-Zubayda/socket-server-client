<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" width="1000" height="735" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b8a3c"/>
    </marker>
  </defs>
  <rect width="1000" height="735" fill="#ffffff"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Pinky Network</text>

  <!-- network zones -->
  <rect x="40" y="70" width="920" height="250" rx="16" fill="#e8f1fb" stroke="#4a86c5" stroke-width="2"/>
  <text x="60" y="100" font-size="17" font-weight="bold" fill="#2c5f94">FASTCAMPUS_10F</text>
  <rect x="40" y="420" width="920" height="300" rx="16" fill="#fdf1e3" stroke="#d48a2c" stroke-width="2"/>
  <text x="940" y="665" text-anchor="end" font-size="17" font-weight="bold" fill="#9a5c12">team2_5G</text>

  <!-- I : FASTCAMPUS AP -->
  <rect x="400" y="120" width="200" height="70" rx="10" fill="#fff" stroke="#4a86c5" stroke-width="2"/>
  <text x="500" y="150" text-anchor="middle" font-size="18" font-weight="bold">I · FASTCAMPUS AP</text>
  <text x="500" y="174" text-anchor="middle" font-size="14" fill="#555">Internet</text>

  <!-- R : team2 router -->
  <rect x="400" y="560" width="200" height="70" rx="10" fill="#fff" stroke="#d48a2c" stroke-width="2"/>
  <text x="500" y="590" text-anchor="middle" font-size="18" font-weight="bold">R · team2 router</text>
  <text x="500" y="614" text-anchor="middle" font-size="14" fill="#555">team2_5G / team2_2_4G</text>

  <!-- O -->
  <rect x="350" y="665" width="300" height="44" rx="22" fill="#fff" stroke="#d48a2c" stroke-width="2"/>
  <text x="500" y="693" text-anchor="middle" font-size="16" font-weight="bold">O · Control system (관제시스템)</text>
  <line x1="500" y1="630" x2="500" y2="663" stroke="#444" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- P : Pinky (spans both zones) -->
  <rect x="80" y="250" width="240" height="240" rx="14" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="200" y="285" text-anchor="middle" font-size="20" font-weight="bold">P · Pinky</text>
  <rect x="96" y="318" width="208" height="62" rx="8" fill="#e8f1fb" stroke="#4a86c5"/>
  <text x="200" y="343" text-anchor="middle" font-size="13" font-weight="bold">IP1 · USB dongle</text>
  <text x="200" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f94">192.168.129.116</text>
  <rect x="96" y="388" width="208" height="62" rx="8" fill="#fdf1e3" stroke="#d48a2c"/>
  <text x="200" y="413" text-anchor="middle" font-size="13" font-weight="bold">IP2 · internal WiFi</text>
  <text x="200" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5c12">192.168.180.53</text>

  <!-- L : laptop -->
  <rect x="700" y="250" width="230" height="240" rx="14" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <text x="815" y="285" text-anchor="middle" font-size="20" font-weight="bold">L · Laptop</text>
  <rect x="716" y="318" width="198" height="62" rx="8" fill="#e8f1fb" stroke="#4a86c5"/>
  <text x="815" y="343" text-anchor="middle" font-size="13">on FASTCAMPUS_10F</text>
  <text x="815" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f94">192.168.129.121</text>
  <rect x="716" y="388" width="198" height="62" rx="8" fill="#fdf1e3" stroke="#d48a2c"/>
  <text x="815" y="413" text-anchor="middle" font-size="13">on team2_5G</text>
  <text x="815" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5c12">192.168.180.51</text>

  <!-- WiFi links -->
  <line x1="304" y1="330" x2="400" y2="175" stroke="#4a86c5" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="330" y="230" font-size="13" fill="#2c5f94" transform="rotate(-58 330 230)">dongle</text>
  <line x1="304" y1="440" x2="400" y2="580" stroke="#d48a2c" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="335" y="520" font-size="13" fill="#9a5c12" transform="rotate(55 335 520)">internal</text>
  <line x1="600" y1="175" x2="716" y2="330" stroke="#4a86c5" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="600" y1="580" x2="716" y2="440" stroke="#d48a2c" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- ping results -->
  <path d="M700,352 C560,250 440,250 320,350" fill="none" stroke="#1b8a3c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <rect x="440" y="232" width="120" height="36" rx="8" fill="#eaf7ee" stroke="#1b8a3c"/>
  <text x="500" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b8a3c">ping (1)</text>

  <path d="M700,420 C560,520 440,520 320,422" fill="none" stroke="#1b8a3c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#g)"/>
  <rect x="440" y="477" width="120" height="36" rx="8" fill="#eaf7ee" stroke="#1b8a3c"/>
  <text x="500" y="500" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b8a3c">ping (2)</text>
</svg>
